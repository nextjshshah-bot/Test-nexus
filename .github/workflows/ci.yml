name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_dev_password
          POSTGRES_DB: nexuscore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://nexus:nexus_dev_password@127.0.0.1:5432/nexuscore?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_at_least_thirty_two_characters_long
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_thirty_two_characters_long
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Seed database
        run: npm run db:seed --workspace @nexuscore/api

      - name: Typecheck API
        run: npm run typecheck --workspace @nexuscore/api

      - name: Typecheck Web
        run: npm run typecheck --workspace @nexuscore/web

      - name: Run API tests
        run: npm run test --workspace @nexuscore/api

      - name: Build API
        run: npm run build --workspace @nexuscore/api

      - name: Build Web
        run: npm run build --workspace @nexuscore/web

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t nexuscore-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t nexuscore-web:ci .

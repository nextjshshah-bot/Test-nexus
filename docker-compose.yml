# ---------------------------------------------------------------------------
# NexusCore — full local stack (PostgreSQL + API + Web)
#   docker compose up --build
#   Web  -> http://localhost:3000
#   API  -> http://localhost:4000
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:17-alpine
    container_name: nexuscore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexuscore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexuscore"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexuscore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nexus:nexus_dev_password@postgres:5432/nexuscore?schema=public
      JWT_ACCESS_SECRET: local_compose_access_secret_change_me_in_production_32
      JWT_REFRESH_SECRET: local_compose_refresh_secret_change_me_in_production_32
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_DOMAIN: ""
      RUN_MIGRATIONS_ON_BOOT: "true"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        API_PROXY_TARGET: http://api:4000
    container_name: nexuscore-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PROXY_TARGET: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_APP_NAME: NexusCore
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
